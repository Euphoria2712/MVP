spring:
  datasource:
    url: jdbc:mysql://mysql:3306/kuanto_users
    username: root
    password: root          
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   

jwt:
  secret: cuanto-super-secret-key-2024-development-only
  expiration: 86400000