server:
  port: 8088

spring:
  application:
    name: freshmart-service

  config:
    import: optional:configserver:http://config-server:8888

mongock:
  migration-scan-package: freshmart_service.migration
  transaction-enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true